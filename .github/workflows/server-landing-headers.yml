name: server-landing-headers
# One-off, by hand only: rewrites the turbogh.app block in Caddy (QA fixes, 2026-11-02):
#  - serves out/404.html with status 404 for missing pages (was an empty response)
#  - security headers (HSTS, nosniff, referrer policy, no framing)
#  - long cache for hashed /_next/static files; Content-Type for the extensionless social images
#  - redirects /privacy to /privacy/ and /index.html to /
# Backs up the Caddyfile, edits it in place (keeps the bind-mounted inode), restarts Caddy, and restores
# the backup if the API, dashboard or landing page stop answering. Safe to run twice. Prints no file contents.
on: workflow_dispatch
concurrency: { group: server-caddy-landing, cancel-in-progress: false }
jobs:
  caddy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Rewrite the turbogh.app block
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/turbo/deploy
          ts=$(date +%Y%m%d-%H%M%S)
          cp Caddyfile "Caddyfile.bak-$ts"
          python3 - <<'PY'
          import re, sys
          s = open('Caddyfile').read()
          m = re.search(r'(?ms)^turbogh\.app \{\n(.*?)^\}\n?', s)
          if not m:
              print('No turbogh.app block found; nothing changed.'); sys.exit(1)
          root = re.search(r'root \* (\S+)', m.group(1))
          if not root:
              print('No root path in the turbogh.app block; nothing changed.'); sys.exit(1)
          block = """turbogh.app {
          	root * %s
          	encode zstd gzip
          	header {
          		Strict-Transport-Security "max-age=31536000"
          		X-Content-Type-Options nosniff
          		Referrer-Policy strict-origin-when-cross-origin
          		Content-Security-Policy "frame-ancestors 'none'"
          		-Server
          	}
          	@static path /_next/static/*
          	header @static Cache-Control "public, max-age=31536000, immutable"
          	@social path /opengraph-image /twitter-image
          	header @social {
          		Content-Type image/png
          		defer
          	}
          	redir /index.html / 308
          	@dir {
          		not path */
          		file {path}/index.html
          	}
          	redir @dir {path}/{?query} 308
          	try_files {path} {path}/index.html
          	file_server
          	handle_errors {
          		@notfound expression {err.status_code} == 404
          		handle @notfound {
          			rewrite * /404.html
          			file_server
          		}
          		respond "{err.status_code} {err.status_text}"
          	}
          }
          """ % root.group(1)
          if m.group(0).strip() == block.strip():
              print('Already up to date; nothing changed.'); sys.exit(0)
          s = s[:m.start()] + block + s[m.end():]
          open('Caddyfile', 'w').write(s)
          print('turbogh.app block rewritten.')
          PY
          docker compose restart caddy
          sleep 8
          if curl -fsS -o /dev/null https://api.turbogh.app/health && curl -fsS -o /dev/null https://admin.turbogh.app/ && curl -fsS -o /dev/null https://turbogh.app/; then
            echo "Caddy restarted; API, dashboard and landing answer."
          else
            echo "Something stopped answering; restoring the previous Caddyfile."
            cp "Caddyfile.bak-$ts" Caddyfile; docker compose restart caddy
            exit 1
          fi
          REMOTE
      - name: Check the new behaviour
        run: |
          sleep 5
          code=$(curl -s -o /tmp/404.html -w '%{http_code}' https://turbogh.app/no-such-page/)
          echo "missing page: $code, $(wc -c < /tmp/404.html) bytes"; test "$code" = 404 && grep -q 'Wrong turn' /tmp/404.html
          curl -sI https://turbogh.app/ | grep -i '^strict-transport-security'
          curl -sI https://turbogh.app/opengraph-image | grep -i '^content-type: image/png'
          curl -s -o /dev/null -w "/privacy -> %{http_code} %{redirect_url}\n" https://turbogh.app/privacy
