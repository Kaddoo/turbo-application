name: turbo_ui
description: "A new Flutter package project."
version: 0.0.1
publish_to: none
homepage:

resolution: workspace
environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # Stock photos from Pexels, credited in assets/photos/CREDITS.md. Apps reach them as packages/turbo_ui/assets/photos/<name>.
  assets:
    - assets/photos/

  # Fonts: Geist and Geist Mono (SIL Open Font License, see fonts/OFL-LICENSE.txt). Apps reach them as packages/turbo_ui/<family>.
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/GeistMono-SemiBold.ttf
          weight: 600
