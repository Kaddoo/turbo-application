          $ref: '#/components/schemas/Pesewas'
        channel:
          type: string
          enum:
          - mobile_money
          - card
      required:
      - amountPesewas
      - channel
      additionalProperties: false
    Topup:
      type: object
      description: Provider agnostic. Redirect = open checkout url. Prompt = tell the student to approve on their phone (Payaza
        mobile money works this way).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        studentId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - abandoned
        amountPesewas:
          $ref: '#/components/schemas/Pesewas'
        channel:
          type: string
          enum:
          - mobile_money
          - card
        reference:
          type: string
        checkout:
          type:
          - object
          - 'null'
          properties:
            type:
              type: string
              enum:
              - redirect
              - prompt
            url:
              type:
              - string
              - 'null'
              format: uri
            message:
              type:
              - string
              - 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        amountReceivedPesewas:
          oneOf:
          - $ref: '#/components/schemas/Pesewas'
          - type: 'null'
          description: What the provider says it collected. Credit is always this amount.
        validation:
          oneOf:
          - type: string
            enum:
            - exact
            - underpayment
            - overpayment
          - type: 'null'
          description: Payaza amount_validation, lower-cased.
        flagged:
          type: boolean
          description: True when validation is not exact, or the provider reversed it, or a reconciliation run found a mismatch.
        flagReason:
          type:
          - string
          - 'null'
          maxLength: 200
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - status
      - amountPesewas
      - channel
      - reference
      - createdAt
