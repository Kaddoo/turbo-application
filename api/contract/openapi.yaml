components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor from `page.nextCursor`.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Client generated UUID. Reuse it when retrying the same request.
  responses:
    BadRequest:
      description: Malformed request or a business rule failed (see `code`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (role, suspended account, or verification required).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource, or it belongs to someone else.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (see `code`), e.g. insufficient balance, quote expired, ride not cancellable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed. `errors[]` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited. Honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Temporarily unavailable (for example the daily SMS ceiling was reached). Retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpgradeRequired:
      description: The app is older than the minimum supported version. Code `upgrade_required`. Show the update screen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
      description: UUID (v7 recommended so ids sort by creation time).
    Pesewas:
      type: integer
      minimum: 0
      format: int64
      description: Money as an integer number of pesewas (GH₵1 = 100 pesewas). Never a float. GH₵35.00 = 3500.
    SignedPesewas:
      type: integer
      format: int64
      description: Signed pesewas. Positive credits the wallet, negative debits it.
    GeoPoint:
      type: object
      description: WGS84. Coordinates in examples are illustrative only, not real campus locations.
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
      example:
        lat: 5.7421
        lng: 0.0668
    Location:
      type: object
      properties:
        point:
          $ref: '#/components/schemas/GeoPoint'
        label:
          type: string
          maxLength: 120
          description: Human readable place name shown in the UI.
        pickupPointId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: Set when the student chose an official campus pickup point.
        landmark:
          type: string
          maxLength: 120
          description: Where exactly to meet, for example "by the main gate". Shown to the driver.
      required:
      - point
    PageInfo:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque. Pass back as ?cursor= for the next page. Null on the last page.
        hasMore:
          type: boolean
      required:
      - nextCursor
      - hasMore
    UserRole:
      type: string
      enum:
      - student
      - driver
      - admin
    StaffRole:
      type: string
      enum:
      - super_admin
      - verifier
      - dispatcher
      - finance
      - support
      - hr
    AccountStatus:
      type: string
      enum:
      - active
      - suspended
    ProblemCode:
      type: string
      enum:
      - validation_failed
      - unauthenticated
      - forbidden
      - not_found
      - conflict
      - rate_limited
      - idempotency_key_reused
      - otp_invalid
      - otp_expired
      - otp_rate_limited
      - account_suspended
      - invalid_credentials
      - mfa_required
      - verification_required
      - verification_not_resubmittable
      - upload_expired
      - outside_service_area
      - route_too_long
      - route_unavailable
      - no_drivers_on_duty
      - quote_expired
      - quote_ineligible
      - insufficient_balance
      - active_ride_exists
      - ride_not_cancellable
      - invalid_ride_state
      - invalid_pin
      - pin_locked
      - driver_has_active_ride
      - driver_not_assigned
      - topup_amount_out_of_range
      - payment_provider_error
      - refund_exceeds_charge
      - shift_overlap
      - sms_budget_exceeded
      - terms_not_accepted
      - duplicate_identity
      - upgrade_required
      - document_expired
      - bookings_paused
      - self_adjustment_forbidden
      - approval_by_requester_forbidden
      - invalid_token
      - account_locked
      - mfa_enrollment_required
      - no_show_too_early
      - account_owes
      - verification_claimed
      description: Stable machine-readable code. Clients switch on this, never on `title` or `detail`.
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON pointer or dotted path
              message:
                type: string
              code:
                type: string
            required:
            - field
            - message
        retryAfterSeconds:
          type: integer
      required:
      - type
      - title
      - status
      - code
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: ^\+233[0-9]{9}$
          description: E.164 Ghana number, e.g. +233241234567
        role:
          type: string
          enum:
          - student
          - driver
        deviceId:
          type: string
          maxLength: 128
          description: Stable per install. Used for per-device limits.
        captchaToken:
          type: string
          description: Required on the web app (and app attestation token on mobile when enabled).
      required:
      - phone
      - role
      additionalProperties: false
    OtpChallenge:
      type: object
      properties:
        expiresInSeconds:
          type: integer
        resendInSeconds:
          type: integer
      required:
      - expiresInSeconds
      - resendInSeconds
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
          pattern: ^\+233[0-9]{9}$
        code:
          type: string
          pattern: ^[0-9]{6}$
        role:
          type: string
          enum:
          - student
          - driver
        clientType:
          type: string
          enum:
          - mobile
          - web
          description: 'mobile: refresh token returned in the body. web: refresh token set as an httpOnly cookie and omitted
            from the body.'
        acceptedTermsVersion:
          type: string
          description: Required on first login (terms_not_accepted if missing). Stored with time and client.
        acceptedPrivacyVersion:
          type: string
      required:
      - phone
      - code
      - role
      - clientType
      additionalProperties: false
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Required once the staff user has enrolled in MFA.
      required:
      - email
      - password
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Mobile clients only. Web clients send the httpOnly cookie instead.
      additionalProperties: false
    SessionUser:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/UserRole'
        staffRole:
          oneOf:
          - $ref: '#/components/schemas/StaffRole'
          - type: 'null'
        displayName:
          type: string
      required:
      - id
      - role
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT, 15 minutes.
        expiresInSeconds:
          type: integer
        refreshToken:
          type: string
          description: Present for clientType=mobile only. Rotated on every refresh.
        user:
          $ref: '#/components/schemas/SessionUser'
      required:
      - accessToken
      - expiresInSeconds
      - user
    DeviceRegistration:
      type: object
      properties:
        deviceId:
          type: string
          maxLength: 128
          description: Client generated, stable per install.
        fcmToken:
          type: string
        platform:
          type: string
          enum:
          - ios
          - android
          - web
        appVersion:
          type: string
      required:
      - deviceId
      - fcmToken
      - platform
      additionalProperties: false
    UploadRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - ghana_card_front
          - ghana_card_back
          - student_id
          - driver_document
          - vehicle_document
          - support_attachment
          - selfie_with_card
          - provider_statement
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
          - text/csv
          description: text/csv is only accepted for purpose provider_statement (reconciliation).
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
      - purpose
      - contentType
      - sizeBytes
      additionalProperties: false
    UploadSlot:
      type: object
      properties:
        uploadId:
          $ref: '#/components/schemas/Id'
        uploadUrl:
          type: string
          format: uri
          description: Short-lived signed URL. PUT the raw bytes here.
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - uploadId
      - uploadUrl
      - method
      - expiresAt
    VerificationStatus:
      type: string
      enum:
      - not_submitted
      - pending
      - approved
      - needs_attention
      - rejected
    VerificationState:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        reasonCode:
          type:
          - string
          - 'null'
          description: Why it was sent back or rejected, e.g. document_unclear, name_mismatch, expired_id.
        message:
          type:
          - string
          - 'null'
          description: Plain-language explanation to show the student.
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        canResubmit:
          type: boolean
      required:
      - status
      - canResubmit
    VerificationSubmission:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          description: As printed on the Ghana Card.
        studentIdNumber:
          type: string
          maxLength: 40
        ghanaCardFrontUploadId:
          $ref: '#/components/schemas/Id'
        ghanaCardBackUploadId:
          $ref: '#/components/schemas/Id'
        studentIdUploadId:
          $ref: '#/components/schemas/Id'
        ghanaCardNumber:
          type: string
          pattern: ^GHA-[0-9]{9}-[0-9]$
          description: 'Stored encrypted. One card, one account: a duplicate returns 409 duplicate_identity.'
        selfieUploadId:
          $ref: '#/components/schemas/Id'
      required:
      - fullName
      - studentIdNumber
      - ghanaCardFrontUploadId
      - ghanaCardBackUploadId
      - studentIdUploadId
      - ghanaCardNumber
      - selfieUploadId
      additionalProperties: false
    Student:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        phone:
          type: string
        fullName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
          format: email
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        createdAt:
          type: string
          format: date-time
        termsAcceptedVersion:
          type:
          - string
          - 'null'
      required:
      - id
      - phone
      - accountStatus
      - verificationStatus
      - createdAt
    StudentUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
      additionalProperties: false
    DeletionRequest:
      type: object
      description: Starts account and data deletion. Required in-app by Apple for apps that create accounts.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - received
          - scheduled
          - completed
        requestedAt:
          type: string
          format: date-time
        scheduledFor:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - status
      - requestedAt
    SavedPlace:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
          maxLength: 40
        location:
          $ref: '#/components/schemas/Location'
      required:
      - id
      - label
      - location
    SavedPlaceCreate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        location:
          $ref: '#/components/schemas/Location'
      required:
      - label
      - location
      additionalProperties: false
    TrustedContact:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        phone:
          type: string
        relationship:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - phone
    TrustedContactCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: ^\+233[0-9]{9}$
        relationship:
          type: string
          maxLength: 40
      required:
      - name
      - phone
      additionalProperties: false
    GeoJsonPolygon:
      type: object
      properties:
        type:
          type: string
          enum:
          - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            minItems: 4
          description: 'GeoJSON order: [lng, lat]. First ring is the outer boundary and must be closed.'
      required:
      - type
      - coordinates
    PickupPoint:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        point:
          $ref: '#/components/schemas/GeoPoint'
        isActive:
          type: boolean
      required:
      - id
      - name
      - point
      - isActive
    PickupPointWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        point:
          $ref: '#/components/schemas/GeoPoint'
        isActive:
          type: boolean
          default: true
      required:
      - name
      - point
      additionalProperties: false
    FareBand:
      type: object
      description: Bands are ordered by upToMeters. The first band starts at 0. Anything above the last band cannot be booked.
      properties:
        upToMeters:
          type: integer
          minimum: 1
          description: Inclusive upper bound of the road-route distance.
        farePesewas:
          type: integer
          minimum: 0
          multipleOf: 100
          format: int64
          description: Whole cedis only (multiples of 100 pesewas) so shared-ride shares stay exact.
      required:
      - upToMeters
      - farePesewas
    FareBandSet:
      type: object
      properties:
        bands:
          type: array
          items:
            $ref: '#/components/schemas/FareBand'
          minItems: 1
      required:
      - bands
      additionalProperties: false
      example:
        bands:
        - upToMeters: 3000
          farePesewas: 1800
        - upToMeters: 6000
          farePesewas: 2500
        - upToMeters: 12000
          farePesewas: 3500
        - upToMeters: 18000
          farePesewas: 5000
    OperatingWindow:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        opensAt:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        closesAt:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
      required:
      - dayOfWeek
      - opensAt
      - closesAt
    ServiceArea:
      type: object
      description: Boundary is null until Turbo approves the exact boundary (open decision D1).
      properties:
        version:
          type: integer
        boundary:
          oneOf:
          - $ref: '#/components/schemas/GeoJsonPolygon'
          - type: 'null'
        pickupPoints:
          type: array
          items:
            $ref: '#/components/schemas/PickupPoint'
        maxTripDistanceMeters:
          type: integer
        fareBands:
          type: array
          items:
            $ref: '#/components/schemas/FareBand'
        operatingHours:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OperatingWindow'
      required:
      - version
      - boundary
      - pickupPoints
      - maxTripDistanceMeters
      - fareBands
      example:
        version: 1
        boundary: null
        pickupPoints: []
        maxTripDistanceMeters: 18000
        fareBands:
        - upToMeters: 3000
          farePesewas: 1800
        - upToMeters: 6000
          farePesewas: 2500
        - upToMeters: 12000
          farePesewas: 3500
        - upToMeters: 18000
          farePesewas: 5000
        operatingHours: null
    ServiceAreaWrite:
      type: object
      properties:
        boundary:
          $ref: '#/components/schemas/GeoJsonPolygon'
      required:
      - boundary
      additionalProperties: false
    Settings:
      type: object
      properties:
        maxTripDistanceMeters:
          type: integer
          minimum: 1000
          default: 18000
        quoteTtlSeconds:
          type: integer
          minimum: 30
          default: 300
        driverAckTimeoutSeconds:
          type: integer
          minimum: 10
          default: 45
        noDriverTimeoutSeconds:
          type: integer
          minimum: 30
          default: 300
        minTopupPesewas:
          $ref: '#/components/schemas/Pesewas'
        maxTopupPesewas:
          $ref: '#/components/schemas/Pesewas'
        operatingHours:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OperatingWindow'
        driverSilenceSeconds:
          type: integer
          minimum: 1
          default: 180
        noShowWaitSeconds:
          type: integer
          minimum: 1
          default: 300
        quoteLimitPerMinute:
          type: integer
          minimum: 1
          default: 10
        smsDailyLimit:
          type: integer
          minimum: 1
          default: 500
        adjustmentApprovalThresholdPesewas:
          type: integer
          minimum: 1
          default: 5000
        locationRetentionDays:
          type: integer
          minimum: 1
          default: 90
        bookingsPaused:
          type: boolean
          default: false
          description: When true, quotes return ineligible with code bookings_paused and the message below. Rides already
            underway continue.
        pauseMessage:
          type:
          - string
          - 'null'
          maxLength: 200
      required:
      - maxTripDistanceMeters
      - quoteTtlSeconds
      - driverAckTimeoutSeconds
      - noDriverTimeoutSeconds
      - minTopupPesewas
      - maxTopupPesewas
    RideStatus:
      type: string
      enum:
      - searching
      - assigned
      - driver_arrived
      - in_progress
      - completed
      - cancelled
    QuoteRequest:
      type: object
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
      required:
      - pickup
      - dropoff
      additionalProperties: false
    IneligibilityReason:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ProblemCode'
        message:
          type: string
          description: Plain-language reason safe to show the student.
      required:
      - code
      - message
    Quote:
      type: object
      description: Ineligibility is a normal 200 answer so the app can explain it and let the student change locations.
      properties:
        eligible:
          type: boolean
        quoteId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          description: Null when eligible is false.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/IneligibilityReason'
        routeDistanceMeters:
          type:
          - integer
          - 'null'
        routeDurationSeconds:
          type:
          - integer
          - 'null'
        farePesewas:
          oneOf:
          - $ref: '#/components/schemas/Pesewas'
          - type: 'null'
        pickupEtaSeconds:
          type:
          - integer
          - 'null'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        wallet:
          type: object
          properties:
            availablePesewas:
              $ref: '#/components/schemas/Pesewas'
            sufficient:
              type: boolean
            shortfallPesewas:
              $ref: '#/components/schemas/Pesewas'
          required:
          - availablePesewas
          - sufficient
          - shortfallPesewas
      required:
      - eligible
      - reasons
      - wallet
      example:
        eligible: true
        quoteId: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a1b
        reasons: []
        routeDistanceMeters: 9400
        routeDurationSeconds: 780
        farePesewas: 3500
        pickupEtaSeconds: 240
        expiresAt: '2026-11-02T08:05:00Z'
        wallet:
          availablePesewas: 6000
          sufficient: true
          shortfallPesewas: 0
    RideCreate:
      type: object
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
      required:
      - quoteId
      additionalProperties: false
    DriverPublic:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        firstName:
          type: string
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
        averageRating:
          type:
          - number
          - 'null'
      required:
      - id
      - firstName
    VehiclePublic:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        colour:
          type: string
        plateNumber:
          type: string
      required:
      - make
      - model
      - colour
      - plateNumber
    Cancellation:
      type: object
      properties:
        by:
          type: string
          enum:
          - student
          - driver
          - system
          - admin
        reasonCode:
          type: string
          enum:
          - student_changed_mind
          - driver_unavailable
          - vehicle_issue
          - no_driver_available
          - service_issue
          - admin_decision
          - other
          - rider_no_show
        note:
          type:
          - string
          - 'null'
        cancelledAt:
          type: string
          format: date-time
      required:
      - by
      - reasonCode
      - cancelledAt
    RidePayment:
      type: object
      properties:
        status:
          type: string
          enum:
          - held
          - charged
          - released
          - refunded
          - partially_refunded
        heldPesewas:
          $ref: '#/components/schemas/Pesewas'
        chargedPesewas:
          $ref: '#/components/schemas/Pesewas'
        refundedPesewas:
          $ref: '#/components/schemas/Pesewas'
      required:
      - status
      - heldPesewas
      - chargedPesewas
      - refundedPesewas
    Ride:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/RideStatus'
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
        routeDistanceMeters:
          type: integer
        farePesewas:
          $ref: '#/components/schemas/Pesewas'
        pin:
          type:
          - string
          - 'null'
