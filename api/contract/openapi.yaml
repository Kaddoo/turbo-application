openapi: 3.1.0
info:
  title: Turbo API
  version: 0.2.2
  description: 'Contract between the Turbo apps, the admin dashboard and the API. **This file is the source of truth. Change
    it first, then code.**


    ## Conventions

    - **Money** is an integer number of pesewas (`3500` = GH₵35.00). Never floats, never strings.

    - **Ids** are UUIDs. **Times** are ISO 8601 in UTC. JSON keys are camelCase.

    - **Pagination** is cursor based: `?cursor=&limit=`; responses carry `page.nextCursor` and `page.hasMore`. No offset pagination.

    - **Errors** are RFC 9457 `application/problem+json` with a stable `code`. Clients switch on `code`.

    - **Idempotency**: every endpoint that moves money or sends SMS takes an `Idempotency-Key` header. Same key and same body
    returns the original result; same key and different body is 409 `idempotency_key_reused`.

    - **Deletes** are soft deletes. Nothing financial is ever hard deleted.

    - **Auth**: `Authorization: Bearer <JWT>` (15 min). Web clients hold the refresh token in an httpOnly cookie; mobile clients
    hold it in secure storage and send it in the body. Rate limits return 429 with `Retry-After`.

    - **Releases**: operations tagged `x-release: v1.1` are specified but must not be built for v1.

    - **Roles**: `x-roles` on each operation. `admin:<role>` means that staff role or `super_admin`.


    ## Staff roles

    | Role | Can |

    | --- | --- |

    | super_admin | Everything, including config, staff and audit log |

    | verifier | Review identity documents, manage student accounts |

    | dispatcher | Monitor, reassign and cancel rides |

    | finance | Wallets, adjustments, refunds, top-up reconciliation |

    | support | Tickets and safety incidents |

    | hr | Drivers, vehicles, shifts, attendance, salary |


    ## Compatibility

    Adding optional fields and new endpoints is non-breaking. Removing or renaming a field, changing a type, or tightening
    validation is breaking and needs a version bump and sign-off from all three developers.



    ## Added in 0.2.0

    - **App version**: send `X-App-Version: ios/1.2.0` (or `android/`, `web/`) on every request. Older than `/app-config`
    minimum gives 426 `upgrade_required`.

    - **Rate limits**: every endpoint can return 429. Quotes are limited per student (`quoteLimitPerMinute`).

    '
  contact:
    name: Bevin Business Solutions
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: http://localhost:4010
  description: Local mock (Prism)
- url: https://api.staging.turbo.invalid/v1
  description: Staging (placeholder)
- url: https://api.turbo.invalid/v1
  description: Production (placeholder)
security:
- bearerAuth: []
tags:
- name: Meta
  description: Health and version.
- name: Auth
  description: OTP login for students and drivers, password and MFA login for staff, token refresh, push tokens.
- name: Uploads
  description: Signed uploads to private storage.
- name: Service area
  description: Public boundary, pickup points, limits and fares.
- name: Student
  description: Student profile, saved places, trusted contacts, deletion.
- name: Verification
  description: Ghana Card and student ID submission.
- name: Rides
  description: Quote, book, track, cancel, receipt.
- name: Safety
  description: Trip sharing and emergency alerts.
- name: Support
  description: Tickets for students and drivers.
- name: Wallet
  description: Balance, history and top-ups.
- name: Webhooks
  description: Payment provider callbacks (internal).
- name: Driver
  description: Driver duty, location, trips, shifts, salary history.
- name: Admin
  description: Staff identity.
- name: 'Admin: Verification'
  description: Review identity documents.
- name: 'Admin: Students'
  description: Student accounts.
- name: 'Admin: Drivers'
  description: Drivers, vehicles and documents.
- name: 'Admin: Rides'
  description: Monitor, reassign and cancel rides.
- name: 'Admin: Config'
  description: Boundary, pickup points, fares and operational settings.
- name: 'Admin: Finance'
  description: Wallets, adjustments, refunds, top-ups.
- name: 'Admin: Support'
  description: Tickets and incidents.
- name: 'Admin: Salary'
  description: Salaries, shifts, attendance and recorded payments.
- name: 'Admin: Staff'
  description: Staff users and the audit log.
paths:
  /health:
    get:
      tags:
      - Meta
      operationId: getHealth
      summary: Liveness and version
      description: '**Access:** Public.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
      x-roles:
      - public
      x-release: v1
  /auth/otp/request:
    post:
      tags:
      - Auth
      operationId: requestOtp
      summary: Send a one-time code by SMS
      description: '**Access:** Public.


        Only +233 numbers are accepted. Limits apply per phone number, per IP and per device. When the daily SMS ceiling (`smsDailyLimit`)
        is hit, returns 503 `sms_budget_exceeded` and staff are alerted.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-roles:
      - public
      x-release: v1
  /auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyOtp
      summary: Exchange a code for tokens
      description: '**Access:** Public.


        Creates the student or driver account on first successful verification. Drivers must already exist (created by an
        admin); an unknown driver number returns 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      security: []
      x-roles:
      - public
      x-release: v1
  /auth/admin/login:
    post:
      tags:
      - Auth
      operationId: adminLogin
      summary: Staff login with email and password
      description: '**Access:** Public.


        All staff must have MFA. Returns 401 `mfa_required` when `totpCode` is missing or wrong. Five failed attempts lock
        the account for 15 minutes (429 `account_locked`). An account that has not finished its invite cannot log in.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-roles:
      - public
      x-release: v1
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshTokens
      summary: Rotate the refresh token and get a new access token
      description: '**Access:** Public.


        Mobile clients send `refreshToken` in the body. Web clients send the httpOnly cookie and an empty body. Refresh tokens
        rotate on every call; reuse of an old one revokes the whole session.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-roles:
      - public
      x-release: v1
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke the current session
      description: '**Access:** any.'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - any
      x-release: v1
  /devices:
    post:
      tags:
      - Auth
      operationId: registerDevice
      summary: Register or update a push token
      description: '**Access:** any.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - any
      x-release: v1
  /devices/{deviceId}:
    delete:
      tags:
      - Auth
      operationId: unregisterDevice
      summary: Remove a push token (call on logout)
      description: '**Access:** any.'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - any
      x-release: v1
  /uploads:
    post:
      tags:
      - Uploads
      operationId: createUpload
      summary: Get a signed URL to upload a file
      description: '**Access:** any.


        Files go straight to private object storage. Nothing here is ever publicly readable. Reference the returned uploadId
        in the next request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - any
      x-release: v1
  /service-area:
    get:
      tags:
      - Service area
      operationId: getServiceArea
      summary: Boundary, pickup points, trip limit and fare bands
      description: '**Access:** Public.


        Safe to cache for 5 minutes. Also used by the landing page.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceArea'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-roles:
      - public
      x-release: v1
  /me:
    get:
      tags:
      - Student
      operationId: getMe
      summary: My profile
      description: '**Access:** student.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
    patch:
      tags:
      - Student
      operationId: updateMe
      summary: Update my profile
      description: '**Access:** student.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/deletion-request:
    post:
      tags:
      - Student
      operationId: requestDeletion
      summary: Start account and data deletion
      description: '**Access:** student.'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/verification:
    get:
      tags:
      - Verification
      operationId: getMyVerification
      summary: My verification status
      description: '**Access:** student.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
    post:
      tags:
      - Verification
      operationId: submitVerification
      summary: Submit or resubmit Ghana Card and student ID
      description: '**Access:** student.


        409 `verification_not_resubmittable` when status is pending, approved or rejected.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationSubmission'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/saved-places:
    get:
      tags:
      - Student
      operationId: listSavedPlaces
      summary: My saved destinations
      description: '**Access:** student.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlaceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
    post:
      tags:
      - Student
      operationId: createSavedPlace
      summary: Save a destination
      description: '**Access:** student.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedPlaceCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/saved-places/{id}:
    delete:
      tags:
      - Student
      operationId: deleteSavedPlace
      summary: Remove a saved destination
      description: '**Access:** student.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/trusted-contacts:
    get:
      tags:
      - Student
      operationId: listTrustedContacts
      summary: My trusted contacts
      description: '**Access:** student.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedContactCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
    post:
      tags:
      - Student
      operationId: createTrustedContact
      summary: Add a trusted contact
      description: '**Access:** student.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedContactCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /me/trusted-contacts/{id}:
    delete:
      tags:
      - Student
      operationId: deleteTrustedContact
      summary: Remove a trusted contact
      description: '**Access:** student.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /rides/quote:
    post:
      tags:
      - Rides
      operationId: createQuote
      summary: Check eligibility, distance, fare and wallet
      description: '**Access:** student.


        Server is the only authority on eligibility and fare. Checks: verified student, no active ride, both points inside
        the boundary, road distance within the limit, drivers on duty. Ineligible answers are 200 with `eligible:false`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      x-roles:
      - student
      x-release: v1
  /rides:
    post:
      tags:
      - Rides
      operationId: createRide
      summary: 'Confirm a quote: hold funds and start finding a driver'
      description: '**Access:** student.


        Errors: 409 `insufficient_balance`, `quote_expired`, `active_ride_exists`. Holds the fare in the wallet, then the
        assignment engine starts. Safe to retry with the same Idempotency-Key.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      x-roles:
      - student
      x-release: v1
    get:
      tags:
      - Rides
      operationId: listMyRides
      summary: My trip history
      description: '**Access:** student.'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RideStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /rides/{id}:
    get:
      tags:
      - Rides
      operationId: getRide
      summary: One of my rides
      description: '**Access:** student.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /rides/{id}/tracking:
    get:
      tags:
      - Rides
      operationId: getRideTracking
      summary: Driver location and ETA
      description: '**Access:** student.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /rides/{id}/cancel:
    post:
      tags:
      - Rides
      operationId: cancelRide
      summary: Cancel for free
      description: '**Access:** student.


        Free at every stage until the trip starts, including after the driver arrives. Releases the hold, or refunds in full
        if already charged. 409 `ride_not_cancellable` once in_progress.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-roles:
      - student
      x-release: v1
  /rides/{id}/receipt:
    get:
      tags:
      - Rides
      operationId: getRideReceipt
      summary: Receipt for a completed or cancelled ride
      description: '**Access:** student.'
