      type: object
      description: available = balance - reserved. Reserved is money held for active rides.
      properties:
        balancePesewas:
          $ref: '#/components/schemas/Pesewas'
        reservedPesewas:
          $ref: '#/components/schemas/Pesewas'
        availablePesewas:
          $ref: '#/components/schemas/Pesewas'
        currency:
          type: string
          enum:
          - GHS
        owedPesewas:
          oneOf:
          - $ref: '#/components/schemas/Pesewas'
          - type: 'null'
          description: Amount the student owes after a provider reversal. While above zero, booking is blocked (account_owes).
      required:
      - balancePesewas
      - reservedPesewas
      - availablePesewas
      - currency
      example:
        balancePesewas: 6000
        reservedPesewas: 0
        availablePesewas: 6000
        currency: GHS
    TransactionType:
      type: string
      enum:
      - topup
      - ride_hold
      - ride_release
      - ride_charge
      - refund
      - adjustment
      - provider_reversal
      description: 'provider_reversal: the network reversed a top-up after it was credited. May take the wallet below zero.'
