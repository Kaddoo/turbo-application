      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/TransactionType'
        amountPesewas:
          $ref: '#/components/schemas/SignedPesewas'
        affectsBalance:
          type: boolean
          description: False for ride_hold and ride_release, which only move money between available and reserved.
        balanceAfterPesewas:
          $ref: '#/components/schemas/Pesewas'
