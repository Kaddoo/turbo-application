# /etc/postgresql/16/main/conf.d/turbo.conf   (sized for an 8 GB / 4 vCPU box running Postgres on its own or with the app)
max_connections = 150                 # PgBouncer keeps real usage near default_pool_size
shared_buffers = 2GB                  # ~25% RAM
effective_cache_size = 5GB            # ~60% RAM
work_mem = 8MB
maintenance_work_mem = 256MB
wal_compression = on
wal_buffers = 16MB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200
idle_in_transaction_session_timeout = 30s   # a stuck request must never hold a wallet row lock
lock_timeout = 5s
log_min_duration_statement = 250ms    # slow query log
autovacuum_max_workers = 4
# Backups: WAL archiving to object storage (pgBackRest or wal-g) gives point-in-time recovery. See the guide.
