# /etc/nginx/sites-available/turbo-api  ->  symlink into sites-enabled
# Put these two lines in the http{} block of /etc/nginx/nginx.conf (or a conf.d file):
#   worker_processes auto; worker_rlimit_nofile 100000;  events { worker_connections 20000; multi_accept on; }
# IMPORTANT: thousands of real users share one public IP (campus Wi-Fi, mobile carrier NAT). 5000 users polling every 5 s is about
# 1000 requests/s from a handful of addresses, so per-IP limits are only a flood guard. Fairness is per account:
# signed-in requests are keyed by their token (one person = one token), everything else by IP.
map $http_authorization $limit_key { default $http_authorization; "" $binary_remote_addr; }
limit_req_zone $limit_key          zone=api_user:50m rate=30r/s;      # a real client does ~0.2 r/s; 30 r/s is generous headroom
limit_req_zone $binary_remote_addr zone=api_flood:20m rate=3000r/s;   # per-IP flood guard, far above any honest NAT crowd
limit_req_zone $binary_remote_addr zone=otp_ip:10m rate=40r/s;        # sign-in storm on launch day; the real limits are per phone and a global SMS budget in the API
limit_req_zone $binary_remote_addr zone=public_ip:10m rate=20r/s;     # trip-share links: unauthenticated, so guard hard
limit_req_zone $binary_remote_addr zone=upload_ip:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

upstream turbo_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=5s;
    keepalive 256;                                   # reuse upstream connections, saves a TCP handshake per request
}

server {
    listen 80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_session_cache shared:SSL:20m;  ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;                       # JSON only; the one exception is /uploads/ below
    client_body_timeout 10s; send_timeout 15s; keepalive_timeout 65s;
    gzip on; gzip_types application/json; gzip_min_length 1024;
    limit_conn conn_ip 20000;                        # flood guard only: a campus NAT legitimately holds thousands of keep-alive connections

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s; proxy_read_timeout 15s;

    location = /health { access_log off; proxy_pass http://turbo_api; }

    location /auth/otp/ { limit_req zone=otp_ip burst=200 nodelay; limit_req_status 429; proxy_pass http://turbo_api; }

    # Photo uploads (signed PUT, up to 10 MB). Without this block nginx would reject them at 256k.
    # No buffering to disk beyond the cap, short timeouts so a slow client cannot hold a worker open (slow-loris).
    location /uploads/ {
        client_max_body_size 11m; client_body_timeout 60s; limit_req zone=upload_ip burst=100 nodelay; limit_req_status 429;
        proxy_request_buffering on; proxy_pass http://turbo_api;
    }
    # Short-lived signed links for staff to view documents. Never cached by a proxy.
    location /files/ { proxy_no_cache 1; proxy_cache_bypass 1; limit_req zone=api_user burst=60 nodelay; limit_req_status 429; proxy_pass http://turbo_api; }
    # Trip-share view for people without an app or account.
    location /public/ { limit_req zone=public_ip burst=40 nodelay; limit_req_status 429; proxy_pass http://turbo_api; }

    # Payment webhook: pass the body through untouched (HMAC is over the raw bytes). Optionally allow only Payaza's IPs once they publish them.
    location /webhooks/ { proxy_request_buffering off; proxy_pass http://turbo_api; }

    # Never expose anything that is not an API route.
    location ~ /\.(?!well-known) { return 404; }

    location / {
        limit_req zone=api_flood burst=6000 nodelay; limit_req zone=api_user burst=60 nodelay; limit_req_status 429;
        proxy_pass http://turbo_api;
    }
}
