; /etc/pgbouncer/pgbouncer.ini
; Many app connections in, few Postgres connections out. Transaction pooling is safe for this API
; (no session state, no prepared statements, no advisory locks; SAVEPOINT stays inside one transaction).
[databases]
turbo = host=127.0.0.1 port=5432 dbname=turbo

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 300
; node-postgres sends statement_timeout as a startup parameter
ignore_startup_parameters = statement_timeout,extra_float_digits,options
